<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Blendmandu">
  <title>Blendmandu</title>
  <!--
    Favicon and app icon only. This is deliberately NOT part of the logo:
    the logo is the wordmark. The cup exists here because a browser tab and
    a home screen need a square, and a wordmark cannot survive 16px.

    Solid masses, never strokes. An earlier monoline version turned to mush
    below about 32px, and an earlier attempt to fold a mountain range into
    the same silhouette read as torn teeth at small sizes. Both were cut.

    The aubergine plate is what makes it legible against light and dark
    browser chrome alike; a transparent cup vanishes on one or the other.
  -->
  <rect width="120" height="120" rx="26" fill="#401930"/>

  <g fill="#f8f7e5">
    <!-- straw: the takeaway signal, kept bold enough to read when tiny -->
    <rect x="65" y="14" width="8" height="34" rx="4" transform="rotate(17 69 31)"/>
    <!-- shallow dome, so the lid never outweighs the cup -->
    <path d="M32 45c0-11.4 10.8-18.4 26.5-18.4S85 33.6 85 45z"/>
    <!-- rim -->
    <rect x="28" y="44" width="61.5" height="8" rx="4"/>
  </g>

  <!-- wall, interior punched so the fill reads as liquid inside the cup -->
  <path fill="#f8f7e5" fill-rule="evenodd"
        d="M35 55h48l-7.2 43.6c-.6 3.7-3.8 6.4-7.6 6.4H49.8c-3.8 0-7-2.7-7.6-6.4zM41.5 61.8l6.2 37.1c.1.7.7 1.1 1.4 1.1h19.8c.7 0 1.3-.4 1.4-1.1l6.2-37.1z"/>

  <!-- the blend -->
  <path fill="#ff834f"
        d="M43 71.3h32l-4.6 27.6c-.1.7-.7 1.1-1.4 1.1H49c-.7 0-1.3-.4-1.4-1.1z"/>
</svg>
