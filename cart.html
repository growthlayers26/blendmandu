<body data-page="cart">

<main class="shell section">
  <h1>Your cart</h1>

  <div id="cart-empty" class="empty" hidden>
    <p class="lede" style="margin-inline:auto">Nothing in here yet.</p>
    <a class="pill pill--accent" href="shop.html">Browse the menu</a>
  </div>

  <div id="cart-body" hidden>
    <div class="cartlayout">

      <section>
        <div id="lines"></div>
        <div class="totals" role="status" aria-live="polite" aria-atomic="true">
          <div class="totals__row"><span>Subtotal</span><span class="totals__val" id="sub">&hellip;</span></div>
          <div class="totals__row"><span>Delivery</span><span class="totals__val" id="ship">&hellip;</span></div>
          <div class="totals__row totals__row--grand"><span>Total</span><span class="totals__val" id="grand">&hellip;</span></div>
        </div>
        <p class="field__hint" id="free-hint"></p>
      </section>

      <section class="panel">
        <p class="eyebrow eyebrow--accent">Checkout</p>
        <h2 style="font-size:1.7rem">Where to?</h2>

        <form id="checkout" novalidate>
          <div class="field">
            <label for="name">Your name</label>
            <input class="input" id="name" required autocomplete="name">
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input class="input" id="phone" type="tel" required autocomplete="tel"
                   inputmode="numeric" placeholder="98XXXXXXXX">
          </div>

          <div class="field">
            <label for="zone">Delivery area</label>
            <select class="input" id="zone"></select>
            <p class="field__hint">We only deliver inside Kathmandu at the moment.</p>
          </div>

          <div class="field">
            <label for="address">Address</label>
            <textarea class="input" id="address" required autocomplete="street-address"
                      placeholder="Street, tole, house or flat number"></textarea>
          </div>

          <div class="field">
            <label for="landmark">Nearest landmark</label>
            <input class="input" id="landmark" autocomplete="address-level3"
                   placeholder="Helps the rider find you faster">
          </div>

          <div class="field">
            <label for="when">When do you want it?</label>
            <select class="input" id="when">
              <option value="now">Right now, 30 to 45 min</option>
              <option value="later">Schedule for later</option>
            </select>
          </div>

          <div class="field" id="when-later" hidden>
            <label for="when-at">Deliver at</label>
            <input class="input" id="when-at" type="datetime-local">
          </div>

          <div class="field">
            <label>Payment</label>
            <div class="choices" id="pay"></div>
          </div>

          <div class="field">
            <label for="notes">Anything else?</label>
            <textarea class="input" id="notes" placeholder="Allergies, no ice, extra ginger…"></textarea>
          </div>

          <button class="pill pill--accent pill--wide" type="submit">Send my order on WhatsApp</button>
          <p class="field__hint" style="text-align:center">Your order is already written out. Press send and we start blending. Nothing is charged on this page.</p>
        </form>
      </section>

    </div>
  </div>
</main>
